<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Sem conexão · Fortalaka</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fafafa;color:#171717;font-family:Arial,sans-serif}
    main{min-height:100dvh;max-width:430px;margin:auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
    img{width:96px;height:96px}h1{font-size:28px;line-height:1.15;margin:28px 0 12px}p{font-size:16px;line-height:1.6;color:#52525b;margin:0 0 20px}button{min-height:48px;padding:12px 20px;background:#c7202b;color:white;border:0;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer}button:focus-visible{outline:3px solid #171717;outline-offset:4px}.brand{font-size:14px;font-weight:900;letter-spacing:.05em;color:#171717;margin-top:16px}
  </style>
  <script src="/pwa/offline.js" defer></script>
</head>
<body><main>
  <img src="/pwa/icon-192.png" alt="Escudo oficial Fortalaka" width="192" height="192">
  <p class="brand">FORTALAKA</p>
  <h1>Você está sem conexão.</h1>
  <p id="connection" role="status">Verifique sua internet e tente novamente. Seus dados não são armazenados nesta página.</p>
  <button id="retry" type="button">TENTAR NOVAMENTE</button>
</main></body>
</html>
